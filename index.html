<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyRT Invoice Runner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div class="mast">
          <p class="eyebrow">MyRT POS</p>
          <h1>Invoice screenshot runner</h1>
        </div>

        <form id="runner-form" class="form">
          <div class="grid">
            <label>
              GitHub owner
              <input id="owner" name="owner" autocomplete="organization" value="Ateeb626" required />
            </label>

            <label>
              Repository
              <input id="repo" name="repo" value="myrt-invoice-automation" required />
            </label>
          </div>

          <div class="grid">
            <label>
              Workflow file
              <input id="workflow" name="workflow" value="run-myrt-invoices.yml" required />
            </label>

            <label>
              Workbook path in repo
              <input id="workbook_path" name="workbook_path" value="input/Signicana_May_No_Tax_Invoices.xlsx" required />
            </label>
          </div>

          <div class="grid">
            <label>
              Start date
              <input id="start_date" name="start_date" type="date" value="2026-05-01" required />
            </label>

            <label>
              End date
              <input id="end_date" name="end_date" type="date" value="2026-05-31" required />
            </label>
          </div>

          <label>
            MyRT username
            <input id="username" name="username" value="Signicana.LA" autocomplete="username" required />
          </label>

          <label>
            GitHub token
            <input id="token" name="token" type="password" autocomplete="off" placeholder="Fine-grained token with Actions: read/write" required />
          </label>

          <button type="submit" id="run-button">Run automation</button>
        </form>

        <div id="status" class="status" role="status" aria-live="polite">
          Store MYRTPOS_PASSWORD as a GitHub Actions secret before running.
        </div>
      </section>
    </main>

    <script src="app.js?v=20260724-1"></script>
  </body>
</html>
